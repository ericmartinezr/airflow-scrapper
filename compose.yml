services:
  grafana:
    image: grafana/otel-lgtm:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - '3000:3000'
      - '4318:4318'
      - '4317:4317'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_storage:/var/lib/grafana

volumes:
  grafana_storage: {}
